# Build and publish the NanoPHP image to GitHub Container Registry.
#
#   ghcr.io/gigaionllc/nanophp
#
# Tagging:
#   - pushing to master publishes :latest
#   - pushing a version tag (v1.2.3) publishes :1.2.3, :1.2 and :1
#   - every publish also gets an immutable :sha-<commit> tag
#
# The Dockerfile runs the full offline verification suite during the build,
# so a published image is a verified image — on both architectures.
#
# The package is created automatically on first publish; it is linked to
# this repository via the org.opencontainers.image.source label.

name: Docker

on:
  push:
    branches: [master]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  # ghcr image names must be lowercase
  IMAGE: ghcr.io/gigaionllc/nanophp

jobs:
  publish:
    name: Build and publish image
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v5

      - name: Set up QEMU (for arm64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata (tags and labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha,prefix=sha-
          flavor: |
            latest=false

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
